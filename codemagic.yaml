workflows:
  smart-accountant-workflow:
    name: دفتر المحاسب الذكي
    max_build_duration: 60
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
      node: 18.17.0
      vars:
        APP_NAME: "دفتر المحاسب الذكي"
        PACKAGE_NAME: "com.smartaccountant.app"
    scripts:
      - name: تثبيت Node.js
        script: |
          npm install -g npm@latest
          npm install -g expo-cli eas-cli
      
      - name: تثبيت التبعيات
        script: |
          cd artifacts/smart-accountant
          npm install --legacy-peer-deps
      
      - name: بناء التطبيق للأندرويد
        script: |
          cd artifacts/smart-accountant
          npx eas-cli build --platform android --profile production --non-interactive
        timeout: 30
      
      - name: بناء التطبيق للـ iOS
        script: |
          cd artifacts/smart-accountant
          npx eas-cli build --platform ios --profile production --non-interactive
        timeout: 30
      
      - name: اختبار التطبيق
        script: |
          cd artifacts/smart-accountant
          npx expo export --platform web
    artifacts:
      - artifacts/smart-accountant/dist/**/*
      - artifacts/smart-accountant/*.apk
      - artifacts/smart-accountant/*.ipa
    publishing:
      email:
        recipients:
          - saddam@smartaccountant.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
