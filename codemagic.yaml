workflows:
  smart-accountant-workflow:
    name: Smart Accountant Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.0.0
    scripts:
      - name: Install
        script: npm install --legacy-peer-deps
      
      - name: Prebuild Android
        script: npx expo prebuild --platform android --clean
      
      - name: Fix Android Resources
        script: |
          find android -name "*.xml" -type f -exec sed -i 's/@drawable\/splashscreen_logo/@color\/splashscreen_background/g' {} \;
      
      - name: Build APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
    
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
