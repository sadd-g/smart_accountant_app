workflows:
  smart-accountant-workflow:
    name: Smart Accountant Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.0.0
    scripts:
      - name: Install
        script: npm install --legacy-peer-deps
      - name: Prebuild
        script: npx expo prebuild --platform android
      - name: Build APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
