workflows:
  smart-accountant-workflow:
    name: Smart Accountant Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.0.0
    scripts:
      - name: Install
        script: npm install --legacy-peer-deps
      - name: Login to Expo
        script: |
          echo "$EXPO_TOKEN" | npx eas-cli login --token
      - name: Build
        script: npx eas-cli build --platform android --profile preview --non-interactive
    artifacts:
      - build/**/*.apk
